name: Blog deploy

# Approved articles reach main through the dashboard blog-publish flow
# (content/blog/<slug>.md). This ships them without waiting for the next manual
# release, and ONLY when the tree on main differs from the live deploy by blog
# content alone. Anything else (code, config, deps) fails the guard: code
# releases stay manual. The live tree is the `site-deployed` tag, moved by this
# workflow and by every manual deploy (docs/url-fixes-deploy-notes.md).
on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'public/images/blog/**'
  workflow_dispatch:

# One site deploy at a time; never cancel one mid-flight.
concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: guard (blog content only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
      live: ${{ steps.diff.outputs.live }}
      tag: ${{ steps.diff.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Only content/blog/** and public/images/blog/** differ from the live deploy
        id: diff
        run: |
          # Manual runs from another branch would ship unmerged content and move the tag off main.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Blog deploy runs on main only (got $GITHUB_REF)."
            exit 1
          fi
          if ! live="$(git rev-parse -q --verify 'refs/tags/site-deployed^{commit}')"; then
            echo "::error::Tag site-deployed is missing, so the live tree is unknown. Deploy manually, then: git tag -f site-deployed <deployed-sha> && git push -f origin refs/tags/site-deployed"
            exit 1
          fi
          printf 'live=%s\ntag=%s\n' "$live" "$(git rev-parse refs/tags/site-deployed)" >> "$GITHUB_OUTPUT"
          # Already live, or a newer commit is (queued/re-run older push): nothing to do, never deploy backwards.
          if git merge-base --is-ancestor "$GITHUB_SHA" "$live"; then
            echo "$GITHUB_SHA is already contained in the live deploy ${live::7}; skipping."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$live" "$GITHUB_SHA"; then
            echo "::error::Live deploy ${live::7} is not an ancestor of $GITHUB_SHA (deployed from another branch?). Deploy manually."
            exit 1
          fi
          # --no-renames: a rename lists both paths, so moving a file into content/blog/ can't hide its source.
          # quotePath=false: accented names print as-is; names git still quotes (control chars) fail the guard.
          changed="$(git -c core.quotePath=false diff --no-renames --name-only "$live" "$GITHUB_SHA")"
          printf 'Changed since site-deployed (%s):\n%s\n' "${live::7}" "$changed"
          other="$(printf '%s\n' "$changed" | grep -Ev '^(content/blog/|public/images/blog/|$)' || true)"
          if [ -n "$other" ]; then
            echo "::error::Non-blog changes are not live yet; code releases are manual. Deploy by hand (that ships the article too):"
            printf '%s\n' "$other"
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    needs: guard
    if: needs.guard.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # moves the site-deployed tag
      issues: write # opens the smoke-failure issue
    env:
      CI: 'true'
      NUXT_TELEMETRY_DISABLED: '1'
      # Build-time values only. Server secrets are NOT needed here: the build
      # bakes them as "" and the Worker's NUXT_* secrets override them at runtime.
      SITE_BASE_URL: https://chantalmasse.com
      BOOKING_TIMEZONE: America/Toronto
      BOOKING_ADVANCE_DAYS: '60'
      BOOKING_MIN_NOTICE_HOURS: '24'
      # Public PostHog key baked into the prerendered pages (repo variable, not a secret).
      NUXT_PUBLIC_POSTHOG_KEY: ${{ vars.NUXT_PUBLIC_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Check CLOUDFLARE_API_TOKEN secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repo secret CLOUDFLARE_API_TOKEN is not set (Workers Scripts: Edit on the chantalmasse-website account)"
            exit 1
          fi

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build (Cloudflare preset, as deployed)
        run: bun run build

      - name: site-deployed has not moved since the guard
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          remote="$(git ls-remote origin refs/tags/site-deployed | cut -f1)"
          if [ "$remote" != "$TAG" ]; then
            echo "::error::site-deployed moved to $remote during this run (manual deploy?). Not deploying over it."
            exit 1
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.165.0 deploy --config .output/server/wrangler.json --message "blog auto-deploy ${GITHUB_SHA::7}"

      - name: Smoke (URL shape + new posts live + booking API)
        id: smoke
        run: |
          sleep 20 # let the new version reach every edge
          bun scripts/check-urls.ts https://chantalmasse.com
          curl -fsS --retry 3 -o /dev/null "https://chantalmasse.com/api/booking/availability?month=$(date -u +%Y-%m)&service=individual"

      # No automatic rollback (Jeremie's rule): the new version stays live, the job fails red,
      # site-deployed stays on the previous commit, and an issue asks Jeremie to decide.
      - name: Smoke failed, open an issue for Jeremie
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE: ${{ needs.guard.outputs.live }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::Smoke failed after deploying ${GITHUB_SHA::7}. It is LIVE and was NOT rolled back; decide by hand (see the issue)."
          gh issue create --assignee jaubut \
            --title "Blog auto-deploy ${GITHUB_SHA::7} failed smoke: live, not rolled back" \
            --body "$(printf '%s\n' \
              "Blog auto-deploy of $GITHUB_SHA went live, then the smoke check failed: $RUN_URL" \
              "" \
              "Nothing was rolled back. site-deployed still points to the previous release ${LIVE::7}. Decide:" \
              "" \
              "- Roll back: \`bunx wrangler rollback --name chantalmasse-website -m \"blog ${GITHUB_SHA::7} failed smoke\"\`" \
              "- Keep it (false alarm, e.g. Google Calendar down): re-run \`bun scripts/check-urls.ts https://chantalmasse.com\`, then \`git tag -f site-deployed $GITHUB_SHA && git push -f origin refs/tags/site-deployed\`")"

      - name: Move site-deployed tag to the live commit
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        # Lease on the tag the guard checked: forward-only (the guard proved ancestry), refused if anyone moved it since.
        run: git push --force-with-lease="refs/tags/site-deployed:$TAG" origin "$GITHUB_SHA:refs/tags/site-deployed"
