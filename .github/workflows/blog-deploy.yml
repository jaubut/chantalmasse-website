name: Blog deploy

# Approved articles reach main through the dashboard blog-publish flow
# (content/blog/<slug>.md). This ships them without waiting for the next manual
# release, and ONLY when the tree on main differs from the live deploy by blog
# content alone. Anything else (code, config, deps) fails the guard: code
# releases stay manual. The live tree is the `site-deployed` tag, moved by this
# workflow and by every manual deploy (docs/url-fixes-deploy-notes.md).
on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'public/images/blog/**'
  workflow_dispatch:

# One site deploy at a time; never cancel one mid-flight.
concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: guard (blog content only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Only content/blog/** and public/images/blog/** differ from the live deploy
        run: |
          if ! git rev-parse -q --verify refs/tags/site-deployed >/dev/null; then
            echo "::error::Tag site-deployed is missing, so the live tree is unknown. Deploy manually, then: git tag -f site-deployed <deployed-sha> && git push -f origin refs/tags/site-deployed"
            exit 1
          fi
          changed="$(git diff --name-only refs/tags/site-deployed "$GITHUB_SHA")"
          printf 'Changed since site-deployed (%s):\n%s\n' "$(git rev-parse --short refs/tags/site-deployed)" "$changed"
          other="$(printf '%s\n' "$changed" | grep -Ev '^(content/blog/|public/images/blog/|$)' || true)"
          if [ -n "$other" ]; then
            echo "::error::Non-blog changes are not live yet; code releases are manual. Deploy by hand (that ships the article too):"
            printf '%s\n' "$other"
            exit 1
          fi

  deploy:
    name: deploy
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # moves the site-deployed tag
    env:
      CI: 'true'
      NUXT_TELEMETRY_DISABLED: '1'
      # Build-time values only. Server secrets are NOT needed here: the build
      # bakes them as "" and the Worker's NUXT_* secrets override them at runtime.
      SITE_BASE_URL: https://chantalmasse.com
      BOOKING_TIMEZONE: America/Toronto
      BOOKING_ADVANCE_DAYS: '60'
      BOOKING_MIN_NOTICE_HOURS: '24'
      # Public PostHog key baked into the prerendered pages (repo variable, not a secret).
      NUXT_PUBLIC_POSTHOG_KEY: ${{ vars.NUXT_PUBLIC_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Check CLOUDFLARE_API_TOKEN secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repo secret CLOUDFLARE_API_TOKEN is not set (Workers Scripts: Edit on the chantalmasse-website account)"
            exit 1
          fi

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build (Cloudflare preset, as deployed)
        run: bun run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config .output/server/wrangler.json --message "blog auto-deploy ${GITHUB_SHA::7}"

      - name: Smoke (URL shape + new posts live + booking API)
        id: smoke
        run: |
          sleep 20 # let the new version reach every edge
          bun scripts/check-urls.ts https://chantalmasse.com
          curl -fsS --retry 3 -o /dev/null "https://chantalmasse.com/api/booking/availability?month=$(date -u +%Y-%m)&service=individual"

      - name: Roll back to the previous version (smoke failed)
        # Only when the new version went live and then failed; a failed build/deploy changed nothing.
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 rollback --name chantalmasse-website --yes --message "blog auto-deploy ${GITHUB_SHA::7} failed smoke"

      - name: Move site-deployed tag to the live commit
        run: |
          git tag -f site-deployed "$GITHUB_SHA"
          git push -f origin refs/tags/site-deployed
