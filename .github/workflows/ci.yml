name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single required check: `ci`. Dependency-update PRs auto-merge only when it is green.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NUXT_TELEMETRY_DISABLED: '1'
      # Non-secret configuration only. No Google / Resend / Brevo / Twilio /
      # Anthropic / Turso / Meta credentials exist in CI on purpose: the build
      # doesn't need them, and without them the API routes answer 400/503
      # instead of ever reaching a real service.
      SITE_BASE_URL: https://chantalmasse.com
      BOOKING_TIMEZONE: America/Toronto
      BOOKING_ADVANCE_DAYS: '60'
      BOOKING_MIN_NOTICE_HOURS: '24'
      NUXT_PUBLIC_POSTHOG_KEY: ''
    steps:
      - uses: actions/checkout@v4

      # Node 24 = the Vercel project's runtime; bun 1.3.11 = the version that writes bun.lock.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit & server tests
        run: bun run test

      - name: Build (Vercel preset, as deployed)
        run: bun run build

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Smoke tests (node-server build + Playwright)
        run: bun run test:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
