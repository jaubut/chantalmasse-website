name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single required check: `ci`. Dependency-update PRs auto-merge only when it is green.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      # Non-secret configuration only. No Google / Resend / dashboard / Twilio /
      # Anthropic / Turso / Meta credentials exist in CI on purpose: the build
      # doesn't need them, and without them the API routes answer 400/503
      # instead of ever reaching a real service.
      SITE_BASE_URL: https://chantalmasse.com
      BOOKING_TIMEZONE: America/Toronto
      BOOKING_ADVANCE_DAYS: '60'
      BOOKING_MIN_NOTICE_HOURS: '24'
      NUXT_PUBLIC_POSTHOG_KEY: ''
    steps:
      - uses: actions/checkout@v7

      # Node 24 for the build (the site runs on Cloudflare Workers); bun 1.3.11 = the version that writes bun.lock.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # bun manages packages; package.json's stale `packageManager: yarn` must not trigger a yarn cache.
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck (Astro)
        run: bun run typecheck

      - name: Unit & server tests
        run: bun run test

      - name: Reminder & session rule tests
        run: bun run test:reminder && bun run test:rules

      - name: Build (Astro Cloudflare Worker)
        run: bun run build
